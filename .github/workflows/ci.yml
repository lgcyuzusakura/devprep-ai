name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wrapper: sh ./mvnw
          - os: windows-latest
            wrapper: .\mvnw.cmd
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Set up Python for content importer tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install content importer dependencies
        run: python -m pip install -r scripts/content-import/requirements.txt
      - name: Run local content parser tests
        run: npm run test:imports
      - name: Install frontend dependencies
        run: npm ci
      - name: Build the frontend
        run: npm run build
      - name: Test and package the Spring Boot backend
        working-directory: backend-java
        run: ${{ matrix.wrapper }} -B verify
      - name: Check the cross-platform launcher
        run: node scripts/start.mjs --help
      - name: Install Chromium for end-to-end tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        if: runner.os == 'Linux'
        env:
          DEVPREP_E2E_SKIP_BUILD: '1'
        run: npm run test:e2e
      - name: Run independent account end-to-end tests
        if: runner.os == 'Linux'
        run: npx playwright test --config playwright.accounts.config.js
